[package]
name = "aha-misc"
version = "0.0.1"
edition = "2024"
authors = ["qrzbing <qrzbingfoxmail.com>"]
license = "MIT OR Apache-2.0"
description = "Aha's Mischief Maker"
repository = "https://github.com/qrzbing/aha-misc"

[lib]
name = "aha_misc"
path = "src/lib.rs"

[features]
default = []
openssl = ["dep:openssl"]
rustls = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:webpki-roots"
]

[dependencies]
clap = { version="4.5.48", features = ["derive"] }
env_logger = "0.11.8"
libafl = { version = "0.15.3" }
libafl_bolts = { version = "0.15.3" }
libc = "0.2.176"
log = "0.4.28"
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }
sysinfo = "0.36.1"

# OpenSSL Dependencies
openssl = { version = "0.10.73", optional = true }

# Rustls Dependencies
rustls = { version = "0.23.35", optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
tokio = { version = "1.48.0", features = ["net", "io-util", "rt"], optional = true }
tokio-rustls = { version = "0.26.4", optional = true }
webpki-roots = { version = "1.0.4", optional = true }

[build-dependencies]
cc = "1.2.38"
